name: Nymi native core
on:
  push:
    branches: [main]
    paths: ['CMakeLists.txt', 'native/**', '.github/workflows/native-core.yml']
  pull_request:
    paths: ['CMakeLists.txt', 'native/**', '.github/workflows/native-core.yml']
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure pure C++ tests
        run: cmake -S . -B build/native -DNYMI_BUILD_DESKTOP=OFF -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/native --config Release
      - name: Test
        run: ctest --test-dir build/native --build-config Release --output-on-failure
